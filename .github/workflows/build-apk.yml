name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the installer
        run: gradle assembleDebug --no-daemon

      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk TownMartInventory.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TownMartInventory-apk
          path: TownMartInventory.apk

      - name: Keep a copy of the APK on the "apk" branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk
          git rm -r -q --cached .
          git add -f TownMartInventory.apk
          git commit -q -m "APK from build ${{ github.run_number }}"
          git push -f origin apk

      - name: Publish as a release (easy download on the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" TownMartInventory.apk \
            --title "Town Mart Inventory (build ${{ github.run_number }})" \
            --notes "Download TownMartInventory.apk on your Android phone and tap it to install." \
            --latest
